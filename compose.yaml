services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ORIGIN: http://192.168.8.235:3000
      DATABASE_URL: postgres://pba_print:pba_print@db:5432/pba_print
      PRINTER_HOST: 192.168.1.222
      PRINTER_ADMIN_PASSWORD: admin
      ADMIN_USERNAME: parkside
      ADMIN_PASSWORD: adobe
      SYNC_INTERVAL_MINUTES: 15
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pba_print
      POSTGRES_PASSWORD: pba_print
      POSTGRES_DB: pba_print
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pba_print']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
