# Minimal cupsd.conf for the print gateway container.
#
# Departs from CUPS's out-of-the-box defaults in one important way:
# stock CUPS only accepts printing from localhost unless told otherwise,
# but client Macs need to reach this over the LAN. Admin operations
# (creating/deleting queues) are still restricted to localhost -- those
# only ever happen via control-api.ts, running in this same container,
# never from a remote Mac.
#
# NOT yet validated against the real church LAN -- review before
# trusting this on a network any less trusted than "staff Macs only".
# See gateway/README.md.

# "info" (not "warn") so the error_log records each job's lifecycle --
# queued / sent to printer / completed / failed-with-reason -- which is what
# the dashboard's per-queue "activity" view surfaces as succeeded vs failed
# jobs. The /logs endpoint only ever returns a bounded tail, so the extra
# volume is fine.
LogLevel info
# CUPS writes a "total" summary line per completed job:
#   printer  cups-job-id  user  total  <pages>  [dd/Mon/yyyy:HH:MM:SS +ZZZZ]  job-name
# i.e. tokens: %p %j %u %P %C %T %{job-name}. %T is the standard CLF
# timestamp (two space-separated tokens, bracketed) -- we use it instead of
# %{time-at-completed}, which CUPS does NOT populate at page-log time (it
# writes "???"). job-name is last so it can contain spaces. The dashboard
# captures gateway jobs from this (control-api.ts readPageLog) so billing a
# gateway job never depends on the printer echoing its code back.
PageLogFormat "%p %j %u %P %C %T %{job-name}"

# Listen on all interfaces, not just localhost, so client Macs can print.
Port 631
Listen /run/cups/cups.sock

Browsing Off
BrowseLocalProtocols none

DefaultAuthType Basic
WebInterface No

<Location />
  Order allow,deny
  Allow all
</Location>

# Admin operations (queue creation/deletion) stay localhost-only --
# control-api.ts runs in this same container and talks to cupsd over
# the local socket/loopback, never from a remote Mac.
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Allow localhost
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Allow localhost
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
