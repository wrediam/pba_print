# Full production stack: the app + its own Postgres. This is what to
# point Coolify (or any Docker host, including a TrueNAS VM) at. The
# repo's compose.yaml (auto-generated by `sv add drizzle`) is separate --
# that one's just a bare Postgres container for local development via
# `npm run db:start`, not used in production.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      PORT: 3000
      ORIGIN: ${ORIGIN:?Set ORIGIN to how this app will be reached, e.g. http://printer-dash.local:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-pba_print}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-pba_print}
      PRINTER_HOST: ${PRINTER_HOST:-192.168.1.222}
      PRINTER_ADMIN_PASSWORD: ${PRINTER_ADMIN_PASSWORD:?}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pba_print}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-pba_print}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pba_print}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
