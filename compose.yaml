services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ORIGIN: http://192.168.8.235:3000
      DATABASE_URL: postgres://pba_print:pba_print@db:5432/pba_print
      PRINTER_HOST: 192.168.1.222
      PRINTER_ADMIN_PASSWORD: admin
      ADMIN_USERNAME: parkside
      ADMIN_PASSWORD: adobe
      SYNC_INTERVAL_SECONDS: 30
      GATEWAY_URL: http://gateway:8631
      GATEWAY_SHARED_SECRET: change-me-gateway-secret
      # Read by src/lib/server/gateway/client.ts, which overrides
      # whatever URI the gateway's own control API returns with this --
      # a staff Mac/PC can't resolve "gateway" (that's a Docker-internal
      # name only this app's own network sees). NOTE THE FORMAT
      # DIFFERENCE from the gateway service's own GATEWAY_PUBLIC_HOST
      # below: client.ts wants host:port together, control-api.ts wants
      # a bare host and appends :631 itself. Same variable name, two
      # different expected shapes -- worth double-checking both are set
      # and correctly formatted any time this is touched again (missing
      # this on the app side specifically was what caused the installer
      # to get back "ipp://gateway:631/..." instead of a real LAN
      # address, since client.ts's fallback derives from GATEWAY_URL's
      # Docker-internal hostname when this is unset).
      GATEWAY_PUBLIC_HOST: 192.168.8.235:631
    healthcheck:
      # node (always present in these images) instead of wget/curl, which
      # aren't installed in the slim base -- that's why the containers
      # showed "unhealthy" even while serving fine.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # Print gateway -- see gateway/README.md and docs/GATEWAY_MIGRATION.md.
  # Sits between client Macs and the physical copier: one real CUPS
  # queue per person+department combo, account code baked in server-side
  # instead of relying on a per-macOS-user CUPS default.
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - '631:631' # IPP, so client Macs can print through it
    environment:
      GATEWAY_SHARED_SECRET: change-me-gateway-secret # must match the app's value above
      PRINTER_HOST: 192.168.1.222
      # Read by gateway/control-api.ts itself -- bare host/IP, NO port
      # (control-api.ts appends :631 itself). Contrast with the app
      # service's GATEWAY_PUBLIC_HOST above, which DOES include the port
      # -- see the comment there. In practice the app's client.ts always
      # overrides whatever URI this container returns before it reaches
      # an installer, so this mostly matters for anyone/anything hitting
      # this container's API directly, and for its own required-at-
      # startup check -- but keep it correct anyway.
      GATEWAY_PUBLIC_HOST: 192.168.8.235
    volumes:
      # Persist the WHOLE /etc/cups, not just ppd/ -- the queue definitions
      # live in /etc/cups/printers.conf, so persisting only ppd/ (the old
      # setup) still lost every queue on redeploy. The image seeds an empty
      # volume with package defaults + our cupsd.conf on first boot (see
      # gateway/entrypoint.sh).
      - gateway_cups:/etc/cups
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8631/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pba_print
      POSTGRES_PASSWORD: pba_print
      POSTGRES_DB: pba_print
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pba_print']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  gateway_cups:
